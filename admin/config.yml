backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "settings"
    label: "Настройки сайта"
    files:
      - label: "Профиль автора"
        name: "profile"
        file: "settings/profile.json"
        fields:
          - { label: "Имя Фамилия", name: "name", widget: "string", default: "Михаил Тарбагаев" }
          - { label: "Специализация / Подзаголовок", name: "subtitle", widget: "string", default: "Композитор & Саунд-продюсер" }
          - { label: "Биография / О себе", name: "bio", widget: "markdown" }
          - { label: "Фотография (Аватар)", name: "avatar", widget: "image", required: false }

  - name: "projects"
    label: "Проекты (Портфолио)"
    folder: "projects"
    create: true
    slug: "{{year}}-{{slug}}"
    format: "json"
    fields:
      - { label: "Порядковый номер (1 - верхний)", name: "order", widget: "number", default: 1, value_type: "int" }
      - { label: "Название проекта", name: "title", widget: "string" }
      - { label: "Роль / Категория", name: "role", widget: "string", required: false }
      - { label: "Обложка / Кадр проекта", name: "image", widget: "image" }
      - { label: "Аудио-демо трека (MP3 или прямая ссылка)", name: "audio", widget: "string", required: false }
      - { label: "Описание участия в проекте", name: "description", widget: "markdown" }
      - { label: "Текст на ссылке", name: "link_text", widget: "string", default: "Смотреть проект →" }
      - { label: "Ссылка на проект (Steam / YouTube / Сайт)", name: "link_url", widget: "string", required: false }

  - name: "posts"
    label: "Публикации"
    folder: "posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "json"
    fields:
      - { label: "Порядковый номер", name: "order", widget: "number", default: 1, value_type: "int" }
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Дата публикации", name: "date", widget: "datetime", date_format: "DD.MM.YYYY", time_format: false }
      - { label: "Текст записи (Форматированный)", name: "body", widget: "markdown", required: false }
      - label: "Тип медиа"
        name: "media_type"
        widget: "select"
        options: ["none", "musescore", "youtube", "audio", "image"]
        default: "none"
      - { label: "Медиафайл или Ссылка (MuseScore/YouTube/MP3)", name: "media_url", widget: "string", required: false }
