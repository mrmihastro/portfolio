<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Михаил Тарбагаев</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    :root {
      --bg: #0a0b0d;
      --card-bg: #13151a;
      --accent: #d4af37;
      --accent-muted: rgba(212, 175, 55, 0.15);
      --text: #e1e4ea;
      --text-muted: #8b929d;
      --border: #20242c;
      --border-hover: #383f4d;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 0% 50%, rgba(212, 175, 55, 0.07) 0%, transparent 45%),
        radial-gradient(circle at 100% 50%, rgba(212, 175, 55, 0.07) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    .orb-background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: absolute;
      bottom: -300px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.28;
      animation: riseAndFloat linear infinite;
    }

    .orb-left-1 { width: 320px; height: 320px; background: radial-gradient(circle, #d4af37, #856114, transparent); left: -80px; animation-duration: 22s; }
    .orb-left-2 { width: 220px; height: 220px; background: radial-gradient(circle, #f3e5ab, #aa7c11, transparent); left: 4%; animation-duration: 16s; animation-delay: 8s; }
    .orb-right-1 { width: 380px; height: 380px; background: radial-gradient(circle, #b8860b, #4a3505, transparent); right: -100px; animation-duration: 26s; animation-delay: 3s; }
    .orb-right-2 { width: 260px; height: 260px; background: radial-gradient(circle, #ffd700, #996515, transparent); right: 3%; animation-duration: 19s; animation-delay: 12s; }

    @keyframes riseAndFloat {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 0.35; }
      80% { opacity: 0.25; }
      100% { transform: translateY(-130vh) scale(1.2); opacity: 0; }
    }

    /* Главный полноэкранный блок (Первый экран) */
    .hero-section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 2rem 1.5rem 5rem;
      z-index: 1;
    }

    .hero-card {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6);
      max-width: 960px;
      width: 100%;
    }

    .hero-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    @media (min-width: 768px) {
      .hero-card {
        flex-direction: row;
        align-items: stretch;
      }
    }

    .avatar-wrapper {
      width: 100%;
      height: 300px;
      flex-shrink: 0;
      position: relative;
    }

    @media (min-width: 768px) {
      .avatar-wrapper {
        width: 310px;
        height: auto;
      }
    }

    .avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-right: 1px solid var(--border);
    }

    .hero-info {
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-grow: 1;
    }

    .hero-info h1 {
      font-family: 'Cinzel', serif;
      margin: 0 0 0.5rem;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .hero-info .subtitle {
      color: var(--accent);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      margin-bottom: 1.4rem;
      font-weight: 600;
    }

    .hero-info .bio {
      color: var(--text-muted);
      margin: 0;
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.7;
    }

    /* Парящая кнопка-стрелка скролла */
    .scroll-indicator {
      position: absolute;
      bottom: 1.8rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--accent);
      opacity: 0.6;
      transition: opacity 0.3s ease, transform 0.3s ease;
      cursor: pointer;
      animation: floatBounce 2.4s infinite ease-in-out;
    }

    .scroll-indicator:hover {
      opacity: 1;
    }

    .scroll-indicator svg {
      width: 28px;
      height: 28px;
      stroke: var(--accent);
    }

    @keyframes floatBounce {
      0%, 100% {
        transform: translate(-50%, 0);
      }
      50% {
        transform: translate(-50%, 10px);
      }
    }

    /* Основной контейнер контента */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
      position: relative;
      z-index: 1;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin: 4.5rem 0 2.2rem;
    }

    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      letter-spacing: 2px;
      color: var(--accent);
      margin: 0;
      text-transform: uppercase;
      font-weight: 600;
    }

    .section-line { flex: 1; height: 1px; background: var(--border); }

    /* Карточки проектов */
    .project-card {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 2rem;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      transition: border-color 0.3s ease, transform 0.3s ease;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .project-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    @media (min-width: 720px) {
      .project-card {
        flex-direction: row;
        align-items: center;
      }
    }

    .project-image-wrapper {
      width: 100%;
      flex-shrink: 0;
      padding: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 720px) {
      .project-image-wrapper {
        width: 42%;
        padding: 1.5rem 0 1.5rem 1.5rem;
      }
    }

    .project-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: block;
      transition: transform 0.4s ease;
      background: #000;
    }

    .project-card:hover .project-img {
      transform: scale(1.02);
      border-color: var(--border-hover);
    }

    .project-content {
      padding: 1.5rem 1.8rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }

    .project-role {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .project-title {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      color: #fff;
      margin: 0 0 0.8rem 0;
    }

    .project-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 300;
      margin-bottom: 1.5rem;
    }

    .project-desc p { margin: 0 0 0.5rem 0; }
    .project-desc p:last-child { margin-bottom: 0; }
    .project-desc ul { margin: 0.4rem 0 0.8rem 1.2rem; padding: 0; }
    .project-desc li { margin-bottom: 0.3rem; }

    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      letter-spacing: 0.5px;
      align-self: flex-start;
      border-bottom: 1px solid var(--accent);
      padding-bottom: 2px;
      transition: opacity 0.2s;
    }

    .project-link:hover { opacity: 0.8; }

    /* Карточки постов */
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 2.2rem;
      margin-bottom: 2rem;
      border: 1px solid var(--border);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .card:hover { border-color: var(--border-hover); box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6); }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .post-date { font-size: 0.8rem; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
    .post-badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--accent-muted);
      color: var(--accent);
      font-weight: 500;
    }

    .card h3 { font-family: 'Cinzel', serif; margin: 0 0 0.8rem; color: #fff; font-size: 1.4rem; }

    .post-body { color: var(--text); margin: 0 0 1.5rem 0; font-weight: 300; }
    .post-body p { margin: 0 0 0.8rem 0; }
    .post-body p:last-child { margin-bottom: 0; }
    .post-body strong, .bio strong { font-weight: 600; color: #fff; }
    .post-body em, .bio em { font-style: italic; color: #d0d4dc; }
    .post-body del { text-decoration: line-through; opacity: 0.6; }
    .post-body u { text-decoration: underline; text-underline-offset: 3px; }
    
    .post-body h1, .post-body h2, .post-body h3 { color: var(--accent); margin: 1.2rem 0 0.5rem; font-family: 'Cinzel', serif; }
    .post-body h1 { font-size: 1.3rem; } .post-body h2 { font-size: 1.15rem; } .post-body h3 { font-size: 1.05rem; }

    .post-body a, .bio a { color: var(--accent); text-decoration: underline; }
    .post-body ul, .post-body ol { margin: 0.5rem 0 1rem 1.2rem; padding: 0; }

    .media-container { width: 100%; margin-top: 1.2rem; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: #000; }
    .musescore-container iframe { width: 100%; height: 680px; border: none; display: block; background: #fff; }
    .video-container iframe { width: 100%; aspect-ratio: 16 / 9; height: auto; border: none; display: block; }
    audio { width: 100%; margin-top: 1rem; filter: invert(0.88) hue-rotate(180deg); }
    img.post-img { width: 100%; max-height: 550px; object-fit: cover; display: block; }

    .skeleton-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 2.2rem; margin-bottom: 2rem; }
    .skeleton-line { height: 16px; background: linear-gradient(90deg, #181b22 25%, #232732 50%, #181b22 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; margin-bottom: 1rem; }
    .skeleton-title { height: 26px; width: 60%; margin-bottom: 1.5rem; }
    .skeleton-media { height: 240px; width: 100%; border-radius: 8px; }

    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .footer { text-align: center; margin-top: 5rem; padding-top: 2rem; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--text-muted); }
    .footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>

  <div class="orb-background">
    <div class="orb orb-left-1"></div>
    <div class="orb orb-left-2"></div>
    <div class="orb orb-right-1"></div>
    <div class="orb orb-right-2"></div>
  </div>

  <!-- Первый экран (Hero) строго по центру -->
  <section class="hero-section">
    <header class="hero-card" id="hero-block">
      <div class="avatar-wrapper">
        <img class="avatar" id="author-avatar" src="" alt="Михаил Тарбагаев">
      </div>
      <div class="hero-info">
        <h1 id="author-name">Михаил Тарбагаев</h1>
        <div class="subtitle" id="author-subtitle">Композитор & Саунд-продюсер</div>
        <div class="bio" id="author-bio"></div>
      </div>
    </header>

    <!-- Парящая стрелка скролла -->
    <a href="#portfolio-start" class="scroll-indicator" aria-label="Прокрутить к проектам">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
      </svg>
    </a>
  </section>

  <!-- Контент портфолио -->
  <div class="container" id="portfolio-start">

    <!-- Секция Проектов -->
    <div class="section-header">
      <h2 class="section-title">Проекты</h2>
      <div class="section-line"></div>
    </div>
    <div id="projects-container">
      <div class="skeleton-card">
        <div class="skeleton-line skeleton-title"></div>
        <div class="skeleton-line" style="width: 80%;"></div>
        <div class="skeleton-line skeleton-media"></div>
      </div>
    </div>

    <!-- Секция Партитур и Блога -->
    <div class="section-header">
      <h2 class="section-title">Публикации</h2>
      <div class="section-line"></div>
    </div>
    <div id="posts-container">
      <div class="skeleton-card">
        <div class="skeleton-line skeleton-title"></div>
        <div class="skeleton-line" style="width: 80%;"></div>
        <div class="skeleton-line skeleton-media"></div>
      </div>
    </div>

    <footer class="footer">
      <p>© 2026 <span id="footer-author-name">Михаил Тарбагаев</span> • <a href="/admin/">Панель управления</a></p>
    </footer>

  </div>

  <script>
    const GITHUB_USER = "mrmihastro";
    const GITHUB_REPO = "portfolio";

    marked.setOptions({ breaks: true, gfm: true });

    function getYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function getBadgeLabel(type) {
      switch(type) {
        case 'musescore': return 'Партитура';
        case 'youtube': return 'Видео';
        case 'audio': return 'Аудио';
        case 'image': return 'Галерея';
        default: return 'Запись';
      }
    }

    async function loadProfile() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/settings/profile.json`);
        if (!res.ok) return;
        const fileData = await res.json();
        const profile = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

        if (profile.name) {
          document.getElementById('author-name').textContent = profile.name;
          document.getElementById('footer-author-name').textContent = profile.name;
          document.title = profile.name;
        }
        if (profile.subtitle) document.getElementById('author-subtitle').textContent = profile.subtitle;
        if (profile.bio) document.getElementById('author-bio').innerHTML = marked.parse(profile.bio);
        if (profile.avatar) document.getElementById('author-avatar').src = profile.avatar;
      } catch (err) {
        console.log('Используются стандартные данные');
      }
    }

    async function loadProjects() {
      const container = document.getElementById('projects-container');
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/projects`);
        if (!response.ok) throw new Error('Папка проектов пока пуста');
        const files = await response.json();
        
        let projectsData = [];
        for (const file of files) {
          if (file.name.endsWith('.json')) {
            const res = await fetch(file.download_url);
            const proj = await res.json();
            projectsData.push(proj);
          }
        }

        projectsData.sort((a, b) => (Number(a.order) || 999) - (Number(b.order) || 999));
        container.innerHTML = '';

        projectsData.forEach((project, index) => {
          const descHtml = project.description ? marked.parse(project.description) : '';
          const card = document.createElement('div');
          card.className = 'project-card';
          card.style.animationDelay = `${index * 0.1}s`;
          card.innerHTML = `
            <div class="project-image-wrapper">
              <img class="project-img" src="${project.image || ''}" alt="${project.title}">
            </div>
            <div class="project-content">
              <div>
                ${project.role ? `<div class="project-role">${project.role}</div>` : ''}
                <h3 class="project-title">${project.title}</h3>
                <div class="project-desc">${descHtml}</div>
              </div>
              ${project.link_url ? `<a href="${project.link_url}" target="_blank" rel="noopener" class="project-link">${project.link_text || 'Смотреть проект →'}</a>` : ''}
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Проекты пока не добавлены.</p>';
      }
    }

    async function loadPosts() {
      const container = document.getElementById('posts-container');
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/posts`);
        if (!response.ok) throw new Error('Ошибка загрузки');
        const files = await response.json();
        
        let postsData = [];
        for (const file of files) {
          if (file.name.endsWith('.json')) {
            const postRes = await fetch(file.download_url);
            const post = await postRes.json();
            postsData.push(post);
          }
        }

        postsData.sort((a, b) => (Number(a.order) || 999) - (Number(b.order) || 999));
        container.innerHTML = '';

        postsData.forEach((post, index) => {
          renderCard(container, post, index * 0.1);
        });
      } catch (err) {
        container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Записи пока отсутствуют.</p>';
      }
    }

    function renderCard(container, post, delay) {
      let mediaHtml = '';
      
      if (post.media_type === 'musescore' && post.media_url) {
        let src = post.media_url.includes('src="') ? post.media_url.match(/src="([^"]+)"/)[1] : post.media_url;
        mediaHtml = `
          <div class="media-container musescore-container">
            <iframe src="${src}" referrerpolicy="no-referrer" allowfullscreen></iframe>
          </div>
        `;
      } else if (post.media_type === 'youtube' && post.media_url) {
        let videoId = getYouTubeId(post.media_url);
        if (videoId) {
          mediaHtml = `
            <div class="media-container video-container">
              <iframe 
                src="https://www.youtube-nocookie.com/embed/${videoId}" 
                title="YouTube player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
              </iframe>
            </div>
          `;
        }
      } else if (post.media_type === 'audio' && post.media_url) {
        mediaHtml = `<audio controls><source src="${post.media_url}" type="audio/mpeg"></audio>`;
      } else if (post.media_type === 'image' && post.media_url) {
        mediaHtml = `
          <div class="media-container">
            <img class="post-img" src="${post.media_url}" alt="Post image">
          </div>
        `;
      }

      const bodyHtml = post.body ? marked.parse(post.body) : '';

      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = `${delay}s`;
      card.innerHTML = `
        <div class="card-meta">
          <span class="post-date">${post.date || ''}</span>
          <span class="post-badge">${getBadgeLabel(post.media_type)}</span>
        </div>
        <h3>${post.title}</h3>
        ${bodyHtml ? `<div class="post-body">${bodyHtml}</div>` : ''}
        ${mediaHtml}
      `;
      container.appendChild(card);
    }

    loadProfile();
    loadProjects();
    loadPosts();

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
