<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Михаил Тарбагаев</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    :root {
      --bg: #121316;
      --card-bg: #1a1b1f;
      --accent: #d4af37;
      --text: #f0f2f5;
      --text-muted: #9ba1a6;
      --border: #2d3139;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      line-height: 1.6;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
      padding: 3rem 1.25rem;
    }

    /* Блок Обо мне */
    .hero-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      margin-bottom: 3rem;
    }

    @media (min-width: 640px) {
      .hero-card {
        flex-direction: row;
        text-align: left;
      }
    }

    .avatar-wrapper {
      flex-shrink: 0;
      width: 140px;
      height: 140px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
    }

    .hero-info h1 {
      margin: 0 0 0.4rem;
      font-size: 2rem;
      color: #fff;
      font-weight: 700;
    }

    .hero-info .subtitle {
      color: var(--accent);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.8rem;
      font-weight: 600;
    }

    .hero-info .bio {
      color: var(--text-muted);
      margin: 0;
      font-size: 1rem;
    }

    /* Лента постов */
    .section-title {
      font-size: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
      border: 1px solid var(--border);
    }

    .card h3 {
      margin: 0 0 0.5rem;
      color: #fff;
      font-size: 1.35rem;
    }

    .post-date {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .post-body {
      color: var(--text);
      margin: 0 0 1.2rem 0;
    }

    /* Адаптивные медиа-контейнеры */
    .media-container {
      width: 100%;
      margin-top: 1rem;
    }

    /* Окно партитуры MuseScore: высокое вертикальное пространство */
    .musescore-container iframe {
      width: 100%;
      height: 680px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }

    /* Окно видео YouTube: строгое соотношение 16:9 */
    .video-container iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      border: none;
      border-radius: 8px;
    }

    audio {
      width: 100%;
      margin-top: 1rem;
    }

    img.post-img {
      width: 100%;
      max-height: 550px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .admin-link {
      text-align: center;
      margin-top: 4rem;
      font-size: 0.85rem;
    }

    .admin-link a {
      color: var(--text-muted);
      text-decoration: none;
    }

    .admin-link a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Блок "Обо мне" -->
    <header class="hero-card">
      <div class="avatar-wrapper">
        <img class="avatar" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&q=80" alt="Фото композитора">
      </div>
      <div class="hero-info">
        <h1>Имя Композитора</h1>
        <div class="subtitle">Композитор & Саунд-дизайнер</div>
        <p class="bio">
          Музыка для кинематографа, видеоигр и мультимедиа. Академическая партитурная запись и интерактивный саунд-дизайн.
        </p>
      </div>
    </header>

    <div class="section-title">Публикации и проекты</div>
    <div id="posts-container">Загрузка записей...</div>

    <div class="admin-link">
      <a href="/admin/">Панель управления</a>
    </div>

  </div>

  <script>
    const GITHUB_USER = "mrmihastro";
    const GITHUB_REPO = "portfolio";

    async function loadPosts() {
      const container = document.getElementById('posts-container');
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/posts`);
        if (!response.ok) throw new Error('Ошибка загрузки');
        const files = await response.json();
        
        container.innerHTML = '';
        
        for (const file of files.reverse()) {
          if (file.name.endsWith('.json')) {
            const postRes = await fetch(file.download_url);
            const post = await postRes.json();
            renderCard(container, post);
          }
        }
      } catch (err) {
        container.innerHTML = '<p style="color:var(--text-muted);">Записи загружаются или репозиторий еще настраивается.</p>';
      }
    }

    function renderCard(container, post) {
      let mediaHtml = '';
      
      if (post.media_type === 'musescore' && post.media_url) {
        let src = post.media_url.includes('src="') ? post.media_url.match(/src="([^"]+)"/)[1] : post.media_url;
        mediaHtml = `
          <div class="media-container musescore-container">
            <iframe src="${src}" allowfullscreen></iframe>
          </div>
        `;
      } else if (post.media_type === 'youtube' && post.media_url) {
        let videoId = post.media_url.includes('watch?v=') ? post.media_url.split('watch?v=')[1].split('&')[0] : post.media_url;
        let src = videoId.startsWith('http') ? videoId : `https://www.youtube-nocookie.com/embed/${videoId}`;
        mediaHtml = `
          <div class="media-container video-container">
            <iframe src="${src}" allowfullscreen></iframe>
          </div>
        `;
      } else if (post.media_type === 'audio' && post.media_url) {
        mediaHtml = `<audio controls><source src="${post.media_url}" type="audio/mpeg"></audio>`;
      } else if (post.media_type === 'image' && post.media_url) {
        mediaHtml = `<img class="post-img" src="${post.media_url}" alt="Post image">`;
      }

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="post-date">${post.date || ''}</div>
        <h3>${post.title}</h3>
        ${post.body ? `<p class="post-body">${post.body}</p>` : ''}
        ${mediaHtml}
      `;
      container.appendChild(card);
    }

    loadPosts();

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
