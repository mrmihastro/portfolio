<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портфолио Композитора</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: rgba(26, 28, 35, 0.65);
      --accent: #d4af37;
      --accent-glow: rgba(212, 175, 55, 0.35);
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* Фоновые световые пятна */
    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
      pointer-events: none;
      opacity: 0.5;
      animation: float 14s ease-in-out infinite alternate;
    }
    .glow-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      top: -100px;
      left: -100px;
    }
    .glow-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(70, 40, 120, 0.4) 0%, transparent 70%);
      bottom: -150px;
      right: -100px;
      animation-duration: 18s;
      animation-direction: alternate-reverse;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(80px, 60px) scale(1.15); }
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    /* Блок Обо мне / Hero */
    .hero-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      margin-bottom: 3.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      transform-style: preserve-3d;
      perspective: 1000px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.3s ease;
    }

    @media (min-width: 640px) {
      .hero-card {
        flex-direction: row;
        text-align: left;
      }
    }

    .avatar-wrapper {
      position: relative;
      flex-shrink: 0;
      width: 150px;
      height: 150px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      box-shadow: 0 0 25px var(--accent-glow);
    }

    .hero-info h1 {
      margin: 0 0 0.5rem;
      font-size: 2rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-info .subtitle {
      color: var(--accent);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .hero-info .bio {
      color: var(--text-muted);
      margin: 0;
      font-size: 0.95rem;
    }

    /* Лента публикаций */
    .section-title {
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
      border: 1px solid var(--border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      transform-style: preserve-3d;
      perspective: 1000px;
      transition: transform 0.15s ease-out, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover, .hero-card:hover {
      border-color: rgba(212, 175, 55, 0.3);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 20px var(--accent-glow);
    }

    .card h3 {
      margin: 0 0 0.5rem;
      color: #fff;
      font-size: 1.3rem;
    }

    .post-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    iframe, audio, img {
      width: 100%;
      border: none;
      border-radius: 10px;
      margin-top: 1.2rem;
      background: rgba(0, 0, 0, 0.2);
    }

    .admin-link {
      text-align: center;
      margin-top: 4rem;
      font-size: 0.85rem;
    }

    .admin-link a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .admin-link a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="container">

    <!-- Блок Hero -->
    <header class="hero-card tilt-element">
      <div class="avatar-wrapper">
        <img class="avatar" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&q=80" alt="Фото композитора">
      </div>
      <div class="hero-info">
        <h1>Имя Композитора</h1>
        <div class="subtitle">Композитор & Саунд-дизайнер</div>
        <p class="bio">
          Музыка для кино, видеоигр и театральных постановок. Сочетание академических инструментов с гибридным синтезом.
        </p>
      </div>
    </header>

    <!-- Секция постов -->
    <div class="section-title">Избранные работы и дневник</div>
    <div id="posts-container">Загрузка проектов...</div>

    <div class="admin-link">
      <a href="/admin/">Панель управления</a>
    </div>

  </div>

  <script>
    const GITHUB_USER = "mrmihastro";
    const GITHUB_REPO = "portfolio";

    async function loadPosts() {
      const container = document.getElementById('posts-container');
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/posts`);
        if (!response.ok) throw new Error('Ошибка загрузки');
        const files = await response.json();
        
        container.innerHTML = '';
        
        for (const file of files.reverse()) {
          if (file.name.endsWith('.json')) {
            const postRes = await fetch(file.download_url);
            const post = await postRes.json();
            renderCard(container, post);
          }
        }
        initTilt();
      } catch (err) {
        container.innerHTML = '<p style="color:var(--text-muted);">Записи загружаются или репозиторий еще настраивается.</p>';
      }
    }

    function renderCard(container, post) {
      let mediaHtml = '';
      if (post.media_type === 'musescore' && post.media_url) {
        let src = post.media_url.includes('src="') ? post.media_url.match(/src="([^"]+)"/)[1] : post.media_url;
        mediaHtml = `<iframe height="420" src="${src}" allowfullscreen></iframe>`;
      } else if (post.media_type === 'youtube' && post.media_url) {
        let videoId = post.media_url.includes('watch?v=') ? post.media_url.split('watch?v=')[1].split('&')[0] : post.media_url;
        let src = videoId.startsWith('http') ? videoId : `https://www.youtube-nocookie.com/embed/${videoId}`;
        mediaHtml = `<iframe height="380" src="${src}" allowfullscreen></iframe>`;
      } else if (post.media_type === 'audio' && post.media_url) {
        mediaHtml = `<audio controls><source src="${post.media_url}" type="audio/mpeg"></audio>`;
      } else if (post.media_type === 'image' && post.media_url) {
        mediaHtml = `<img src="${post.media_url}" alt="Media content">`;
      }

      const card = document.createElement('div');
      card.className = 'card tilt-element';
      card.innerHTML = `
        <div class="post-date">${post.date || ''}</div>
        <h3>${post.title}</h3>
        <p style="color: var(--text-muted); margin:0;">${post.body || ''}</p>
        ${mediaHtml}
      `;
      container.appendChild(card);
    }

    // 3D Tilt эффект при движении курсора
    function initTilt() {
      const elements = document.querySelectorAll('.tilt-element');
      
      elements.forEach(el => {
        el.addEventListener('mousemove', (e) => {
          const rect = el.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          
          const rotateX = ((y - centerY) / centerY) * -7;
          const rotateY = ((x - centerX) / centerX) * 7;
          
          el.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
        });

        el.addEventListener('mouseleave', () => {
          el.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)';
        });
      });
    }

    initTilt();
    loadPosts();

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
