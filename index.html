  <style>
    :root {
      --bg: #0a0b0d;
      --card-bg: #13151a;
      --accent: #d4af37;
      --accent-muted: rgba(212, 175, 55, 0.15);
      --text: #e1e4ea;
      --text-muted: #8b929d;
      --border: #20242c;
      --border-hover: #383f4d;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 0% 50%, rgba(212, 175, 55, 0.07) 0%, transparent 45%),
        radial-gradient(circle at 100% 50%, rgba(212, 175, 55, 0.07) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    .orb-background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: absolute;
      bottom: -300px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.28;
      animation: riseAndFloat linear infinite;
    }

    .orb-left-1 { width: 320px; height: 320px; background: radial-gradient(circle, #d4af37, #856114, transparent); left: -80px; animation-duration: 22s; }
    .orb-left-2 { width: 220px; height: 220px; background: radial-gradient(circle, #f3e5ab, #aa7c11, transparent); left: 4%; animation-duration: 16s; animation-delay: 8s; }
    .orb-right-1 { width: 380px; height: 380px; background: radial-gradient(circle, #b8860b, #4a3505, transparent); right: -100px; animation-duration: 26s; animation-delay: 3s; }
    .orb-right-2 { width: 260px; height: 260px; background: radial-gradient(circle, #ffd700, #996515, transparent); right: 3%; animation-duration: 19s; animation-delay: 12s; }

    @keyframes riseAndFloat {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 0.35; }
      80% { opacity: 0.25; }
      100% { transform: translateY(-130vh) scale(1.2); opacity: 0; }
    }

    /* Hero экран */
    .hero-section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 2rem 1.5rem;
      z-index: 2;
    }

    .hero-card {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6);
      max-width: 960px;
      width: 100%;
    }

    .hero-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    @media (min-width: 768px) {
      .hero-card {
        flex-direction: row;
        align-items: stretch;
      }
    }

    .avatar-wrapper {
      width: 100%;
      height: 320px;
      flex-shrink: 0;
      position: relative;
    }

    @media (min-width: 768px) {
      .avatar-wrapper {
        width: 320px;
        height: auto;
      }
    }

    .avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-right: 1px solid var(--border);
    }

    .hero-info {
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-grow: 1;
    }

    .hero-info h1 {
      font-family: 'Cinzel', serif;
      margin: 0 0 0.4rem;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .hero-info .subtitle {
      color: var(--accent);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      margin-bottom: 1.2rem;
      font-weight: 600;
    }

    .hero-info .bio {
      color: var(--text-muted);
      margin: 0 0 1.8rem 0;
      font-size: 0.95rem;
      font-weight: 300;
      line-height: 1.65;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem;
    }

    .btn-contact-hero {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #0c0d10;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 0.6rem 1.4rem;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
    }

    .btn-contact-hero:hover {
      opacity: 0.9;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1rem;
      background: #181a20;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .scroll-indicator {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--accent);
      cursor: pointer;
      animation: floatBounce 2.2s infinite ease-in-out;
      transition: opacity 0.2s ease;
      z-index: 3;
    }

    .scroll-indicator svg {
      width: 36px;
      height: 36px;
      stroke: var(--accent);
      filter: drop-shadow(0 0 8px var(--accent-muted));
    }

    @keyframes floatBounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, 12px); }
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
      position: relative;
      z-index: 2;
      will-change: transform;
      transform: translateY(0px);
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin: 2rem 0 1.5rem;
    }

    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 1.3rem;
      letter-spacing: 2px;
      color: var(--accent);
      margin: 0;
      text-transform: uppercase;
      font-weight: 600;
    }

    .section-line { flex: 1; height: 1px; background: var(--border); }

    /* Переключатель категорий проектов */
    .project-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 2rem;
    }

    .filter-btn {
      background: #181a20;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.6rem 1.3rem;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .filter-btn:hover {
      border-color: var(--border-hover);
      color: #fff;
    }

    .filter-btn.active {
      background: var(--accent-muted);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    /* Карточки проектов */
    .project-card {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 2rem;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      transition: border-color 0.3s ease, transform 0.3s ease;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .project-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    @media (min-width: 720px) {
      .project-card {
        flex-direction: row;
        align-items: center;
      }
    }

    .project-image-wrapper {
      width: 100%;
      flex-shrink: 0;
      padding: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 720px) {
      .project-image-wrapper {
        width: 42%;
        padding: 1.5rem 0 1.5rem 1.5rem;
      }
    }

    .project-img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: block;
      transition: transform 0.4s ease;
      background: #000;
    }

    .project-card:hover .project-img {
      transform: scale(1.02);
      border-color: var(--border-hover);
    }

    .project-content {
      padding: 1.5rem 1.8rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }

    .project-title {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      color: #fff;
      margin: 0 0 0.3rem 0;
    }

    .project-role {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.9rem;
    }

    .project-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 300;
      margin-bottom: 1.2rem;
    }

    .project-desc p { margin: 0 0 0.5rem 0; }
    .project-desc p:last-child { margin-bottom: 0; }
    .project-desc ul { margin: 0.4rem 0 0.8rem 1.2rem; padding: 0; }
    .project-desc li { margin-bottom: 0.3rem; }

    .project-audio {
      margin-bottom: 1.2rem;
      width: 100%;
    }

    .project-audio audio {
      width: 100%;
      height: 38px;
      filter: invert(0.88) hue-rotate(180deg);
      border-radius: 6px;
    }

    .project-audio iframe {
      width: 100%;
      height: 56px;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: block;
      background: #181a20;
    }

    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      letter-spacing: 0.5px;
      align-self: flex-start;
      border-bottom: 1px solid var(--accent);
      padding-bottom: 2px;
      transition: opacity 0.2s;
    }

    .project-link:hover { opacity: 0.8; }

    /* Карточки постов */
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 2.2rem;
      margin-bottom: 2rem;
      border: 1px solid var(--border);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .card:hover { border-color: var(--border-hover); box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6); }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .post-date { font-size: 0.8rem; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
    .post-badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--accent-muted);
      color: var(--accent);
      font-weight: 500;
    }

    .card h3 { font-family: 'Cinzel', serif; margin: 0 0 0.8rem; color: #fff; font-size: 1.4rem; }

    .post-body { color: var(--text); margin: 0 0 1.5rem 0; font-weight: 300; }
    .post-body p { margin: 0 0 0.8rem 0; }
    .post-body p:last-child { margin-bottom: 0; }
    .post-body strong, .bio strong { font-weight: 600; color: #fff; }
    .post-body em, .bio em { font-style: italic; color: #d0d4dc; }
    .post-body del { text-decoration: line-through; opacity: 0.6; }
    .post-body u { text-decoration: underline; text-underline-offset: 3px; }
    
    .post-body h1, .post-body h2, .post-body h3 { color: var(--accent); margin: 1.2rem 0 0.5rem; font-family: 'Cinzel', serif; }
    .post-body h1 { font-size: 1.3rem; } .post-body h2 { font-size: 1.15rem; } .post-body h3 { font-size: 1.05rem; }

    .post-body a, .bio a { color: var(--accent); text-decoration: underline; }
    .post-body ul, .post-body ol { margin: 0.5rem 0 1rem 1.2rem; padding: 0; }

    .media-container { width: 100%; margin-top: 1.2rem; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: #000; }
    .musescore-container iframe { width: 100%; height: 680px; border: none; display: block; background: #fff; }
    .video-container iframe { width: 100%; aspect-ratio: 16 / 9; height: auto; border: none; display: block; }
    
    .audio-wrapper { margin-top: 1rem; }
    .audio-wrapper audio { width: 100%; filter: invert(0.88) hue-rotate(180deg); }
    .audio-wrapper iframe { width: 100%; height: 56px; border: 1px solid var(--border); border-radius: 8px; display: block; background: #181a20; }
    
    img.post-img { width: 100%; max-height: 550px; object-fit: cover; display: block; }

    /* Секция контактов */
    .contact-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 2.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      background: #0f1013;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 1.2rem;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.2s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
    }

    textarea.form-control {
      min-height: 120px;
      resize: vertical;
    }

    .submit-btn {
      align-self: flex-start;
      background: var(--accent);
      color: #0c0d10;
      border: none;
      border-radius: 8px;
      padding: 0.9rem 2rem;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .submit-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .form-status {
      display: none;
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
      font-size: 0.95rem;
    }

    .form-status.success {
      display: block;
      background: rgba(46, 204, 113, 0.15);
      border: 1px solid #2ecc71;
      color: #2ecc71;
    }

    .skeleton-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 2.2rem; margin-bottom: 2rem; }
    .skeleton-line { height: 16px; background: linear-gradient(90deg, #181b22 25%, #232732 50%, #181b22 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; margin-bottom: 1rem; }
    .skeleton-title { height: 26px; width: 60%; margin-bottom: 1.5rem; }
    .skeleton-media { height: 240px; width: 100%; border-radius: 8px; }

    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .footer { text-align: center; margin-top: 5rem; padding-top: 2rem; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--text-muted); }
    .footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>

  <div class="orb-background">
    <div class="orb orb-left-1"></div>
    <div class="orb orb-left-2"></div>
    <div class="orb orb-right-1"></div>
    <div class="orb orb-right-2"></div>
  </div>

  <!-- Первый экран (Hero) -->
  <section class="hero-section" id="hero-section">
    <header class="hero-card" id="hero-block">
      <div class="avatar-wrapper">
        <img class="avatar" id="author-avatar" src="" alt="Михаил Тарбагаев">
      </div>
      <div class="hero-info">
        <h1 id="author-name">Михаил Тарбагаев</h1>
        <div class="subtitle" id="author-subtitle">Композитор & Саунд-продюсер</div>
        <div class="bio" id="author-bio"></div>
        
        <div class="hero-actions">
          <a href="#contact-section" class="btn-contact-hero">Связаться</a>
          <div id="hero-social-links" style="display: inline-flex; flex-wrap: wrap; gap: 0.6rem;"></div>
        </div>
      </div>
    </header>

    <a href="#portfolio-start" class="scroll-indicator" id="scroll-indicator" aria-label="Прокрутить к проектам">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
      </svg>
    </a>
  </section>

  <!-- Контент портфолио -->
  <div class="container" id="portfolio-start">

    <!-- Секция Проектов -->
    <div class="section-header">
      <h2 class="section-title">Проекты</h2>
      <div class="section-line"></div>
    </div>

    <!-- Кнопки-переключатели категорий -->
    <div class="project-filters" id="project-filters">
      <button class="filter-btn active" data-category="games">Видеоигры</button>
      <button class="filter-btn" data-category="multimedia">Мультимедиа</button>
      <button class="filter-btn" data-category="concerts">Концертная деятельность</button>
    </div>

    <div id="projects-container">
      <div class="skeleton-card">
        <div class="skeleton-line skeleton-title"></div>
        <div class="skeleton-line" style="width: 80%;"></div>
        <div class="skeleton-line skeleton-media"></div>
      </div>
    </div>

    <!-- Секция Публикаций -->
    <div class="section-header">
      <h2 class="section-title">Публикации</h2>
      <div class="section-line"></div>
    </div>
    <div id="posts-container">
      <div class="skeleton-card">
        <div class="skeleton-line skeleton-title"></div>
        <div class="skeleton-line" style="width: 80%;"></div>
        <div class="skeleton-line skeleton-media"></div>
      </div>
    </div>

    <!-- Секция Контактов -->
    <div class="section-header" id="contact-section">
      <h2 class="section-title">Связаться</h2>
      <div class="section-line"></div>
    </div>

    <div class="contact-card">
      <form id="contact-form" action="https://formspree.io/f/xvkpyjzg" method="POST" class="contact-form">
        <div class="form-group">
          <label for="name">Ваше имя</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="Как к вам обращаться" required />
        </div>

        <div class="form-group">
          <label for="email">Ваш E-mail</label>
          <input type="email" id="email" name="_replyto" class="form-control" placeholder="example@mail.ru" required />
        </div>

        <div class="form-group">
          <label for="message">Сообщение или задача</label>
          <textarea id="message" name="message" class="form-control" placeholder="Опишите проект, задачу или предложение..." required></textarea>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">Отправить сообщение</button>
        <div id="form-status" class="form-status"></div>
      </form>
    </div>

    <footer class="footer">
      <p>© 2026 <span id="footer-author-name">Михаил Тарбагаев</span> • <a href="/admin/">Панель управления</a></p>
    </footer>

  </div>

  <script>
    const GITHUB_USER = "mrmihastro";
    const GITHUB_REPO = "portfolio";

    marked.setOptions({ breaks: true, gfm: true });

    let allProjects = [];
    let currentCategory = 'games';

    const filterButtons = document.querySelectorAll('.filter-btn');
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        renderProjects();
      });
    });

    const contactForm = document.getElementById('contact-form');
    const submitBtn = document.getElementById('submit-btn');
    const formStatus = document.getElementById('form-status');

    if (contactForm) {
      contactForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Отправка...';

        try {
          const res = await fetch(contactForm.action, {
            method: 'POST',
            body: new FormData(contactForm),
            headers: { 'Accept': 'application/json' }
          });

          if (res.ok) {
            formStatus.className = 'form-status success';
            formStatus.textContent = 'Спасибо! Ваше сообщение успешно отправлено.';
            contactForm.reset();
          } else {
            formStatus.className = 'form-status';
            formStatus.style.display = 'block';
            formStatus.style.color = '#ff6b6b';
            formStatus.textContent = 'Не удалось отправить сообщение. Пожалуйста, попробуйте связаться через соцсети.';
          }
        } catch (err) {
          formStatus.className = 'form-status';
          formStatus.style.display = 'block';
          formStatus.style.color = '#ff6b6b';
          formStatus.textContent = 'Ошибка сети при отправке.';
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Отправить сообщение';
        }
      });
    }

    function renderAudioPlayer(url) {
      if (!url || typeof url !== 'string' || !url.trim()) return '';
      url = url.trim();

      if (url.includes('drive.google.com/file/d/')) {
        const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        const fileId = match ? match[1] : '';
        if (fileId) return `<iframe src="https://drive.google.com/file/d/${fileId}/preview" allow="autoplay"></iframe>`;
      }

      if (url.includes('soundcloud.com')) {
        return `<iframe width="100%" height="110" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=%23d4af37&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false"></iframe>`;
      }

      return `
        <audio controls preload="none">
          <source src="${url}" type="audio/mpeg">
          <source src="${url}" type="audio/ogg">
          <source src="${url}" type="audio/wav">
        </audio>
      `;
    }

    const scrollIndicator = document.getElementById('scroll-indicator');
    const contentContainer = document.getElementById('portfolio-start');
    
    const MAX_PULL_UP = 140; 
    const SCROLL_RANGE = 350;

    function handleParallax() {
      const scrollY = window.scrollY;

      const progress = Math.min(1, scrollY / SCROLL_RANGE);
      const currentOffset = (1 - progress) * MAX_PULL_UP;
      contentContainer.style.transform = `translateY(${currentOffset}px)`;

      const fadeOpacity = Math.max(0, 1 - (scrollY / 180));
      scrollIndicator.style.opacity = fadeOpacity;
      scrollIndicator.style.pointerEvents = fadeOpacity === 0 ? 'none' : 'auto';
    }

    window.addEventListener('scroll', () => {
      window.requestAnimationFrame(handleParallax);
    }, { passive: true });

    handleParallax();

    function getYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function getBadgeLabel(type) {
      switch(type) {
        case 'musescore': return 'Партитура';
        case 'youtube': return 'Видео';
        case 'audio': return 'Аудио';
        case 'image': return 'Галерея';
        default: return 'Запись';
      }
    }

    async function loadProfile() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/settings/profile.json`);
        if (!res.ok) return;
        const fileData = await res.json();
        const profile = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

        if (profile.name) {
          document.getElementById('author-name').textContent = profile.name;
          document.getElementById('footer-author-name').textContent = profile.name;
        }
        if (profile.subtitle) document.getElementById('author-subtitle').textContent = profile.subtitle;
        if (profile.bio) document.getElementById('author-bio').innerHTML = marked.parse(profile.bio);
        if (profile.avatar) document.getElementById('author-avatar').src = profile.avatar;

        const socialContainer = document.getElementById('hero-social-links');
        let socialHtml = '';
        if (profile.telegram) socialHtml += `<a href="${profile.telegram}" target="_blank" rel="noopener" class="social-btn">Telegram</a>`;
        if (profile.vk) socialHtml += `<a href="${profile.vk}" target="_blank" rel="noopener" class="social-btn">ВКонтакте</a>`;
        if (profile.soundcloud) socialHtml += `<a href="${profile.soundcloud}" target="_blank" rel="noopener" class="social-btn">SoundCloud</a>`;
        if (profile.youtube) socialHtml += `<a href="${profile.youtube}" target="_blank" rel="noopener" class="social-btn">YouTube</a>`;
        socialContainer.innerHTML = socialHtml;

      } catch (err) {
        console.log('Используются стандартные данные');
      }
    }

    async function loadProjects() {
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/projects`);
        if (!response.ok) throw new Error('Папка проектов пока пуста');
        const files = await response.json();
        
        allProjects = [];
        for (const file of files) {
          if (file.name.endsWith('.json')) {
            const res = await fetch(file.download_url);
            const proj = await res.json();
            allProjects.push(proj);
          }
        }

        allProjects.sort((a, b) => (Number(a.order) || 999) - (Number(b.order) || 999));
        renderProjects();
      } catch (err) {
        document.getElementById('projects-container').innerHTML = '<p style="color:var(--text-muted); text-align:center;">Проекты пока не добавлены.</p>';
      }
    }

    function renderProjects() {
      const container = document.getElementById('projects-container');
      const filtered = allProjects.filter(p => (p.category || 'games') === currentCategory);

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding: 2rem 0;">В этой категории пока нет проектов.</p>';
        return;
      }

      container.innerHTML = '';
      filtered.forEach((project, index) => {
        const descHtml = project.description ? marked.parse(project.description) : '';
        const audioUrl = project.audio || project.audio_url || project.media_url || project.track || '';
        const audioPlayerHtml = renderAudioPlayer(audioUrl);
        
        const card = document.createElement('div');
        card.className = 'project-card';
        card.style.animationDelay = `${index * 0.08}s`;
        card.innerHTML = `
          <div class="project-image-wrapper">
            <img class="project-img" src="${project.image || ''}" alt="${project.title}">
          </div>
          <div class="project-content">
            <div>
              <h3 class="project-title">${project.title}</h3>
              ${project.role ? `<div class="project-role">${project.role}</div>` : ''}
              <div class="project-desc">${descHtml}</div>
              ${audioPlayerHtml ? `
                <div class="project-audio">
                  ${audioPlayerHtml}
                </div>
              ` : ''}
            </div>
            ${project.link_url ? `<a href="${project.link_url}" target="_blank" rel="noopener" class="project-link">${project.link_text || 'Смотреть проект →'}</a>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function loadPosts() {
      const container = document.getElementById('posts-container');
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/posts`);
        if (!response.ok) throw new Error('Ошибка загрузки');
        const files = await response.json();
        
        let postsData = [];
        for (const file of files) {
          if (file.name.endsWith('.json')) {
            const postRes = await fetch(file.download_url);
            const post = await postRes.json();
            postsData.push(post);
          }
        }

        postsData.sort((a, b) => (Number(a.order) || 999) - (Number(b.order) || 999));
        container.innerHTML = '';

        postsData.forEach((post, index) => {
          renderCard(container, post, index * 0.1);
        });
      } catch (err) {
        container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Записи пока отсутствуют.</p>';
      }
    }

    function renderCard(container, post, delay) {
      let mediaHtml = '';
      
      if (post.media_type === 'musescore' && post.media_url) {
        let src = post.media_url.includes('src="') ? post.media_url.match(/src="([^"]+)"/)[1] : post.media_url;
        mediaHtml = `
          <div class="media-container musescore-container">
            <iframe src="${src}" referrerpolicy="no-referrer" allowfullscreen></iframe>
          </div>
        `;
      } else if (post.media_type === 'youtube' && post.media_url) {
        let videoId = getYouTubeId(post.media_url);
        if (videoId) {
          mediaHtml = `
            <div class="media-container video-container">
              <iframe 
                src="https://www.youtube-nocookie.com/embed/${videoId}" 
                title="YouTube player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
              </iframe>
            </div>
          `;
        }
      } else if (post.media_type === 'audio' && post.media_url) {
        mediaHtml = `<div class="audio-wrapper">${renderAudioPlayer(post.media_url)}</div>`;
      } else if (post.media_type === 'image' && post.media_url) {
        mediaHtml = `
          <div class="media-container">
            <img class="post-img" src="${post.media_url}" alt="Post image">
          </div>
        `;
      }

      const bodyHtml = post.body ? marked.parse(post.body) : '';

      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = `${delay}s`;
      card.innerHTML = `
        <div class="card-meta">
          <span class="post-date">${post.date || ''}</span>
          <span class="post-badge">${getBadgeLabel(post.media_type)}</span>
        </div>
        <h3>${post.title}</h3>
        ${bodyHtml ? `<div class="post-body">${bodyHtml}</div>` : ''}
        ${mediaHtml}
      `;
      container.appendChild(card);
    }

    loadProfile();
    loadProjects();
    loadPosts();

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
