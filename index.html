<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Михаил Тарбагаев</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  
  <style>
    :root {
      --bg: #0a0b0d;
      --card-bg: #13151a;
      --accent: #d4af37;
      --accent-muted: rgba(212, 175, 55, 0.15);
      --text: #e1e4ea;
      --text-muted: #8b929d;
      --border: #20242c;
      --border-hover: #383f4d;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* Фоновый золотистый градиент по краям */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 0% 50%, rgba(212, 175, 55, 0.07) 0%, transparent 45%),
        radial-gradient(circle at 100% 50%, rgba(212, 175, 55, 0.07) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    /* Контейнер для всплывающих снизу сфер */
    .orb-background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .orb {
      position: absolute;
      bottom: -300px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.28;
      animation: riseAndFloat linear infinite;
    }

    .orb-left-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #d4af37, #856114, transparent);
      left: -80px;
      animation-duration: 22s;
    }
    .orb-left-2 {
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, #f3e5ab, #aa7c11, transparent);
      left: 4%;
      animation-duration: 16s;
      animation-delay: 8s;
    }

    .orb-right-1 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, #b8860b, #4a3505, transparent);
      right: -100px;
      animation-duration: 26s;
      animation-delay: 3s;
    }
    .orb-right-2 {
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, #ffd700, #996515, transparent);
      right: 3%;
      animation-duration: 19s;
      animation-delay: 12s;
    }

    @keyframes riseAndFloat {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 0.35;
      }
      80% {
        opacity: 0.25;
      }
      100% {
        transform: translateY(-130vh) scale(1.2);
        opacity: 0;
      }
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
      position: relative;
      z-index: 1;
    }

    /* Hero секция */
    .hero-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem;
      margin-bottom: 4rem;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .hero-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    @media (min-width: 680px) {
      .hero-card {
        flex-direction: row;
        text-align: left;
      }
    }

    .avatar-wrapper {
      flex-shrink: 0;
      position: relative;
      width: 150px;
      height: 150px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
      padding: 4px;
      background: var(--card-bg);
      transition: transform 0.4s ease;
    }

    .avatar-wrapper:hover .avatar {
      transform: scale(1.04);
    }

    .hero-info h1 {
      font-family: 'Cinzel', serif;
      margin: 0 0 0.4rem;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .hero-info .subtitle {
      color: var(--accent);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      margin-bottom: 1.2rem;
      font-weight: 600;
    }

    .hero-info .bio {
      color: var(--text-muted);
      margin: 0;
      font-size: 1rem;
      font-weight: 300;
    }

    /* Заголовки секций */
    .section-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      letter-spacing: 2px;
      color: var(--accent);
      margin: 0;
      text-transform: uppercase;
      font-weight: 600;
    }

    .section-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Карточки публикаций */
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 2.2rem;
      margin-bottom: 2rem;
      border: 1px solid var(--border);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .post-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .post-badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--accent-muted);
      color: var(--accent);
      font-weight: 500;
    }

    .card h3 {
      font-family: 'Cinzel', serif;
      margin: 0 0 0.8rem;
      color: #fff;
      font-size: 1.4rem;
      letter-spacing: 0.5px;
    }

    .post-body {
      color: var(--text);
      margin: 0 0 1.5rem 0;
      font-weight: 300;
    }

    /* Медиа-контейнеры */
    .media-container {
      width: 100%;
      margin-top: 1.2rem;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
    }

    .musescore-container iframe {
      width: 100%;
      height: 680px;
      border: none;
      display: block;
      background: #fff;
    }

    .video-container iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      border: none;
      display: block;
    }

    audio {
      width: 100%;
      margin-top: 1rem;
      filter: invert(0.88) hue-rotate(180deg);
    }

    img.post-img {
      width: 100%;
      max-height: 550px;
      object-fit: cover;
      display: block;
    }

    /* Скелетон */
    .skeleton-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.2rem;
      margin-bottom: 2rem;
    }
    .skeleton-line {
      height: 16px;
      background: linear-gradient(90deg, #181b22 25%, #232732 50%, #181b22 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
      margin-bottom: 1rem;
    }
    .skeleton-title { height: 26px; width: 60%; margin-bottom: 1.5rem; }
    .skeleton-media { height: 260px; width: 100%; border-radius: 8px; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .footer {
      text-align: center;
      margin-top: 5rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .footer a:hover { opacity: 0.8; }
  </style>
</head>
<body>

  <div class="orb-background">
    <div class="orb orb-left-1"></div>
    <div class="orb orb-left-2"></div>
    <div class="orb orb-right-1"></div>
    <div class="orb orb-right-2"></div>
  </div>

  <div class="container">

    <header class="hero-card">
      <div class="avatar-wrapper">
        <img class="avatar" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&q=80" alt="Фото композитора">
      </div>
      <div class="hero-info">
        <h1>Михаил Тарбагаев</h1>
        <div class="subtitle">Композитор & Саунд-продюсер</div>
        <p class="bio">
          Создание оркестровой и гибридной музыки для кинофильмов, видеоигр и мультимедийных проектов. Академическая партитурная запись, интерактивный звук и продакшн.
        </p>
      </div>
    </header>

    <div class="section-header">
      <h2 class="section-title">Партитуры и Медиа</h2>
      <div class="section-line"></div>
    </div>

    <div id="posts-container">
      <div class="skeleton-card">
        <div class="skeleton-line skeleton-title"></div>
        <div class="skeleton-line" style="width: 80%;"></div>
        <div class="skeleton-line skeleton-media"></div>
      </div>
    </div>

    <footer class="footer">
      <p>© 2026 Михаил Тарбагаев • <a href="/admin/">Панель управления</a></p>
    </footer>

  </div>

  <script>
    const GITHUB_USER = "mrmihastro";
    const GITHUB_REPO = "portfolio";

    function getYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function getBadgeLabel(type) {
      switch(type) {
        case 'musescore': return 'Партитура';
        case 'youtube': return 'Видео';
        case 'audio': return 'Аудио';
        case 'image': return 'Галерея';
        default: return 'Запись';
      }
    }

    async function loadPosts() {
      const container = document.getElementById('posts-container');
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/posts`);
        if (!response.ok) throw new Error('Ошибка загрузки');
        const files = await response.json();
        
        container.innerHTML = '';
        
        let delayIndex = 0;
        for (const file of files.reverse()) {
          if (file.name.endsWith('.json')) {
            const postRes = await fetch(file.download_url);
            const post = await postRes.json();
            renderCard(container, post, delayIndex * 0.1);
            delayIndex++;
          }
        }
      } catch (err) {
        container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Записи не найдены или репозиторий еще настраивается.</p>';
      }
    }

    function renderCard(container, post, delay) {
      let mediaHtml = '';
      
      if (post.media_type === 'musescore' && post.media_url) {
        let src = post.media_url.includes('src="') ? post.media_url.match(/src="([^"]+)"/)[1] : post.media_url;
        mediaHtml = `
          <div class="media-container musescore-container">
            <iframe src="${src}" referrerpolicy="no-referrer" allowfullscreen></iframe>
          </div>
        `;
      } else if (post.media_type === 'youtube' && post.media_url) {
        let videoId = getYouTubeId(post.media_url);
        if (videoId) {
          mediaHtml = `
            <div class="media-container video-container">
              <iframe 
                src="https://www.youtube-nocookie.com/embed/${videoId}" 
                title="YouTube player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
              </iframe>
            </div>
          `;
        }
      } else if (post.media_type === 'audio' && post.media_url) {
        mediaHtml = `<audio controls><source src="${post.media_url}" type="audio/mpeg"></audio>`;
      } else if (post.media_type === 'image' && post.media_url) {
        mediaHtml = `
          <div class="media-container">
            <img class="post-img" src="${post.media_url}" alt="Post image">
          </div>
        `;
      }

      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = `${delay}s`;
      card.innerHTML = `
        <div class="card-meta">
          <span class="post-date">${post.date || ''}</span>
          <span class="post-badge">${getBadgeLabel(post.media_type)}</span>
        </div>
        <h3>${post.title}</h3>
        ${post.body ? `<p class="post-body">${post.body}</p>` : ''}
        ${mediaHtml}
      `;
      container.appendChild(card);
    }

    loadPosts();

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
