<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портфолио Композитора</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #d4af37;
      --text: #e0e0e0;
      --text-muted: #a0a0a0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      line-height: 1.6;
    }
    header {
      text-align: center;
      padding: 3rem 1rem 2rem;
      border-bottom: 1px solid #2a2a2a;
    }
    header h1 { margin: 0 0 0.5rem; color: var(--accent); }
    header p { margin: 0; color: var(--text-muted); }
    .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      border: 1px solid #2c2c2c;
    }
    .card h3 { margin-top: 0; color: #fff; }
    .post-date { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.8rem; }
    iframe, audio, img { width: 100%; border: none; border-radius: 6px; margin-top: 0.8rem; }
    .admin-link { text-align: center; margin: 3rem 0 1rem; font-size: 0.8rem; }
    .admin-link a { color: var(--text-muted); text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <h1>Имя Композитора</h1>
    <p>Музыка для кино, игр и медиа</p>
  </header>

  <div class="container">
    <div id="posts-container">Загрузка записей...</div>
    <div class="admin-link"><a href="/admin/">Панель входа</a></div>
  </div>

  <script>
    // GitHub API загрузчик постов
    // После деплоя замени YOUR_USERNAME и YOUR_REPO на свои данные
    const GITHUB_USER = "ТВОЙ_GITHUB_ЛОГИН";
    const GITHUB_REPO = "ИМЯ_РЕПОЗИТОРИЯ";

    async function loadPosts() {
      const container = document.getElementById('posts-container');
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/posts`);
        if (!response.ok) throw new Error('Ошибка загрузки');
        const files = await response.json();
        
        container.innerHTML = '';
        
        // Читаем каждый JSON-файл в папке posts
        for (const file of files.reverse()) {
          if (file.name.endsWith('.json')) {
            const postRes = await fetch(file.download_url);
            const post = await postRes.json();
            renderCard(container, post);
          }
        }
      } catch (err) {
        container.innerHTML = '<p>Пока нет опубликованных постов или не указаны настройки репозитория.</p>';
      }
    }

    function renderCard(container, post) {
      let mediaHtml = '';
      if (post.media_type === 'musescore' && post.media_url) {
        let src = post.media_url.includes('src="') ? post.media_url.match(/src="([^"]+)"/)[1] : post.media_url;
        mediaHtml = `<iframe height="400" src="${src}" allowfullscreen></iframe>`;
      } else if (post.media_type === 'youtube' && post.media_url) {
        let videoId = post.media_url.includes('watch?v=') ? post.media_url.split('watch?v=')[1].split('&')[0] : post.media_url;
        let src = videoId.startsWith('http') ? videoId : `https://www.youtube-nocookie.com/embed/${videoId}`;
        mediaHtml = `<iframe height="380" src="${src}" allowfullscreen></iframe>`;
      } else if (post.media_type === 'audio' && post.media_url) {
        mediaHtml = `<audio controls><source src="${post.media_url}" type="audio/mpeg"></audio>`;
      } else if (post.media_type === 'image' && post.media_url) {
        mediaHtml = `<img src="${post.media_url}" alt="Post image">`;
      }

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="post-date">${post.date || ''}</div>
        <h3>${post.title}</h3>
        <p>${post.body || ''}</p>
        ${mediaHtml}
      `;
      container.appendChild(card);
    }

    loadPosts();

    // Редирект после логина через Netlify Identity
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
